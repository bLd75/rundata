# The charging points' live status: every 15 minutes, La Réunion's part of the national live file
# (scripts/irve-live.ts) is written to the Worker's KV store, where src/providers/irve.ts reads it.
# The national file covers all of France: it is filtered once here rather than by the Worker for each question.
name: Bornes de recharge

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irve
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La Réunion's part of the national file
        run: npx tsx scripts/irve-live.ts irve-etat.json
      - name: Into the KV store, kept 6 hours at most
        run: npx wrangler kv key put irve:etat --path irve-etat.json --binding STORE --remote --ttl 21600
