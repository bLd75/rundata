# The daily check of the sources through rundata.re (scripts/check-sources.ts): a few tools on /mcp and a few pages,
# each failing when its data is older than its source allows, when it says a source did not answer, or when the
# volcano's ORSEC level is unknown. Nothing is asked of the sources themselves. The failure is the alert.
name: Contrôle des sources

on:
  schedule:
    # 07:11 in Réunion: the buses run, Météo-France's morning bulletin is out.
    - cron: "11 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sources
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Les outils et les pages de rundata.re
        run: npx tsx scripts/check-sources.ts https://rundata.re
