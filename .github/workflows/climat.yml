# The past weather (historique_meteo): every morning, once Météo-France has published the day before, the current year
# of every station of La Réunion (scripts/build-climat.py --recent) is rewritten in the D1 database rundata-climat,
# some 70 rows. The years before were imported once, by hand, with the same script.
name: Historique météo

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climat
  cancel-in-progress: true

jobs:
  annee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The current year of every station
        run: python3 -I scripts/build-climat.py --recent --out climat-jour.sql
      - name: Into D1
        run: npx wrangler d1 execute rundata-climat --remote --file climat-jour.sql -y
