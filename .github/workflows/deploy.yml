# Deploys the Worker (rundata.re) once CI has passed on a commit of main, that is after each merged pull request.
# Stops before deploying when the bus timetables this version reads are not in D1 yet (scripts/transit-ready.mjs), or the
# climate archive (scripts/climat-ready.mjs): they are imported by hand first. One deployment at a time, in the order of the commits.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://rundata.re
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bus timetables of this version already in D1
        run: npx wrangler d1 execute rundata-transports --remote --json --command "SELECT feed FROM feeds" | node scripts/transit-ready.mjs
      - name: Climate archive already in D1
        run: npx wrangler d1 execute rundata-climat --remote --json --command "SELECT COUNT(*) AS n FROM postes" | node scripts/climat-ready.mjs
      - name: Hourly climate archive already in D1
        run: npx wrangler d1 execute rundata-climat-h --remote --json --command "SELECT COUNT(*) AS n FROM postes" | node scripts/climat-ready.mjs horaire
      - name: Deploy
        run: npx wrangler deploy
      - name: The site answers
        run: |
          for path in / /meteo /bus; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'accept: text/html' "https://rundata.re$path")
            echo "$path $code"; [ "$code" = 200 ] || exit 1
          done
