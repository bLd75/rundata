# Checks every pull request and every commit on main: types, tests and the build.
# Actions are pinned to a commit (the tag can be moved, the commit cannot); Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Same version in package.json and server.json
        run: node -e 'const a=require("./package.json").version,b=require("./server.json").version;if(a!==b){console.error(`package.json ${a} ≠ server.json ${b}`);process.exit(1)}'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
