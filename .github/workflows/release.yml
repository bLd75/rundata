# A release per version: when a merge on main brings a version of package.json that has no tag yet,
# tags that commit vX.Y.Z and publishes the GitHub release: first what is new for the people of the island, in plain
# French (the lines of src/nouveautes.ts that the previous release did not have, scripts/release-notes.mjs), then
# the merged pull requests.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The previous release's tag, to tell what is new since.
          fetch-depth: 0
      - name: Version
        id: v
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Tag and release, once per version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already released"; exit 0
          fi
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          if [ -n "$PREV" ] && git show "$PREV:src/nouveautes.ts" > "$RUNNER_TEMP/avant.ts" 2>/dev/null; then
            node scripts/release-notes.mjs src/nouveautes.ts "$RUNNER_TEMP/avant.ts" > "$RUNNER_TEMP/notes.md"
          else
            node scripts/release-notes.mjs src/nouveautes.ts > "$RUNNER_TEMP/notes.md"
          fi
          # The generated notes (the pull requests) come after these.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
